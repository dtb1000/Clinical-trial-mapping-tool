name: Test and build Windows app

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .[app] pyinstaller
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(python -c 'import sdtm_helper; print(sdtm_helper.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Build app folder
        run: >
          pyinstaller --noconfirm --windowed --name "SDTM Helper"
          --collect-data sdtm_helper --collect-all saspy
          packaging/launch.py
      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SDTM-Helper-Setup
          path: dist/SDTM-Helper-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SDTM-Helper-Setup-*.exe
          generate_release_notes: true
