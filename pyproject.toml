[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdtm-helper"
version = "0.2.0"
description = "A guide for SAS clinical programmers mapping trial data to CDISC SDTM. It explains and checks; it never writes the mapping code."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "saspy>=5.0",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
app = ["PySide6>=6.6"]
dev = ["pytest>=8", "PySide6>=6.6"]

[project.scripts]
sdtm-helper = "sdtm_helper.cli:main"

[project.gui-scripts]
sdtm-helper-app = "sdtm_helper.app.window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdtm_helper = ["data/**/*.json", "guidance/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
